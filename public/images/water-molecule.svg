<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Real-looking water molecule diagram -->
  <defs>
    <radialGradient id="oxygenGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff8888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="hydrogenGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#999999;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="#f0f8ff" stroke="#ddd" stroke-width="2"/>
  
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">WATER MOLECULE (H₂O)</text>
  
  <!-- Molecular orbital representation -->
  <ellipse cx="150" cy="150" rx="100" ry="60" fill="rgba(100,149,237,0.1)" stroke="rgba(100,149,237,0.3)" stroke-width="2"/>
  
  <!-- Covalent bonds -->
  <line x1="110" y1="120" x2="135" y2="135" stroke="url(#bondGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="165" y1="135" x2="190" y2="120" stroke="url(#bondGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Bond angle indicator -->
  <path d="M 125 125 A 20 20 0 0 1 175 125" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="150" y="115" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">104.5°</text>
  
  <!-- Oxygen atom (center, larger, red) -->
  <circle cx="150" cy="150" r="35" fill="url(#oxygenGrad)" stroke="#990000" stroke-width="3"/>
  <text x="150" y="160" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">O</text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="white">-2</text>
  
  <!-- Hydrogen atoms (smaller, white) -->
  <circle cx="100" cy="110" r="20" fill="url(#hydrogenGrad)" stroke="#666666" stroke-width="2"/>
  <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">H</text>
  <text x="100" y="130" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">+1</text>
  
  <circle cx="200" cy="110" r="20" fill="url(#hydrogenGrad)" stroke="#666666" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">H</text>
  <text x="200" y="130" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">+1</text>
  
  <!-- Electron pairs (lone pairs on oxygen) -->
  <ellipse cx="130" cy="170" rx="8" ry="4" fill="#4169E1" opacity="0.7"/>
  <ellipse cx="170" cy="170" rx="8" ry="4" fill="#4169E1" opacity="0.7"/>
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Lone pairs</text>
  
  <!-- Polarity indicators -->
  <text x="80" y="95" font-family="Arial" font-size="12" fill="#666">δ+</text>
  <text x="210" y="95" font-family="Arial" font-size="12" fill="#666">δ+</text>
  <text x="145" y="210" font-family="Arial" font-size="12" fill="#666">δ-</text>
  
  <!-- Dipole moment arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6347" />
    </marker>
  </defs>
  <line x1="150" y1="230" x2="150" y2="260" stroke="#FF6347" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="155" y="250" font-family="Arial" font-size="10" fill="#FF6347">μ (dipole)</text>
  
  <!-- Properties box -->
  <rect x="20" y="220" width="120" height="70" fill="rgba(255,255,255,0.9)" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="25" y="235" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Properties:</text>
  <text x="25" y="248" font-family="Arial" font-size="9" fill="#666">• Polar molecule</text>
  <text x="25" y="260" font-family="Arial" font-size="9" fill="#666">• Bent geometry</text>
  <text x="25" y="272" font-family="Arial" font-size="9" fill="#666">• Hydrogen bonding</text>
  <text x="25" y="284" font-family="Arial" font-size="9" fill="#666">• Boiling point: 100°C</text>
  
  <!-- Unique recognition features -->
  <rect x="260" y="260" width="30" height="30" fill="#4169E1" opacity="0.3"/>
  <circle cx="275" cy="275" r="8" fill="#FF6347"/>
  <polygon points="10,280 30,280 20,290" fill="#32CD32"/>
</svg>